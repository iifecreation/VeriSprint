name: API tests

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Same image + credentials as docker-compose.yml's local dev Postgres —
    # the test suite needs a real Postgres (pgvector extension included),
    # not SQLite; see apps/api/tests/conftest.py for why.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verisprint
          POSTGRES_PASSWORD: verisprint
          POSTGRES_DB: verisprint
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U verisprint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql+asyncpg://verisprint:verisprint@localhost:55432/verisprint
      REDIS_URL: redis://localhost:56379/0
      # Dev-grade secret — fine for CI, same discipline the README documents
      # for local dev (logs a warning, not a hard failure).
      JWT_SECRET: ci-jwt-secret-not-for-production-use-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
