# VeriSprint production stack for a single server (e.g. Oracle Cloud
# Always Free), with Cloudflare in front. See deploy/DEPLOY.md.
#
#   cd deploy && docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Only Caddy publishes ports (80/443). Postgres, Redis, the API and the
# three frontends are reachable only on the private Docker network.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-api-env: &api-env
  ENV: production
  API_BASE_URL: https://api.${DOMAIN}
  WEB_BASE_URL: https://app.${DOMAIN}
  ADMIN_BASE_URL: https://admin.${DOMAIN}
  MARKETING_BASE_URL: https://${DOMAIN}
  FRONTEND_AUTH_CALLBACK_PATH: /auth/callback
  DATABASE_URL: postgresql+asyncpg://verisprint:${POSTGRES_PASSWORD}@postgres:5432/verisprint
  VECTOR_DB_URL: postgresql+asyncpg://verisprint:${POSTGRES_PASSWORD}@postgres:5432/verisprint
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  # Cloudflare -> Caddy -> API: Caddy puts the visitor's real IP
  # (CF-Connecting-IP) last in X-Forwarded-For, so trust exactly one hop.
  TRUSTED_PROXY_HOPS: "1"
  OIDC_REDIRECT_URL: https://api.${DOMAIN}/auth/sso/callback

services:
  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg16
    cap_drop: []          # the official image needs to switch users at start-up
    environment:
      POSTGRES_USER: verisprint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: verisprint
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verisprint"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g

  redis:
    <<: *hardening
    image: redis:7-alpine
    cap_drop: []
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
      --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
      --rename-command FLUSHALL "" --rename-command FLUSHDB "" --rename-command CONFIG ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 512m

  # One-off: applies database migrations, then exits. The API waits for it.
  migrate:
    build: ../apps/api
    image: verisprint-api:latest
    env_file: .env
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    <<: *hardening
    image: verisprint-api:latest
    env_file: .env
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 1g

  worker:
    <<: *hardening
    image: verisprint-api:latest
    env_file: .env
    environment: *api-env
    command: ["arq", "app.queue.worker.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 1g

  web:
    <<: *hardening
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_ADMIN_APP_URL: https://admin.${DOMAIN}
    mem_limit: 512m

  admin:
    <<: *hardening
    build:
      context: ../apps/admin
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_APP_URL: https://app.${DOMAIN}
    mem_limit: 512m

  marketing:
    <<: *hardening
    build:
      context: ../apps/marketing
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_APP_URL: https://app.${DOMAIN}
    mem_limit: 512m

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - admin
      - marketing
    mem_limit: 256m

  # Nightly compressed database dump, kept for 14 days in ./backups.
  # Copy these off the server too (see DEPLOY.md) — a backup on the same
  # disk doesn't survive losing the disk.
  backup:
    <<: *hardening
    image: pgvector/pgvector:pg16
    cap_drop: []
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/verisprint-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h postgres -U verisprint verisprint | gzip > "$$f" && echo "backup ok: $$f" || echo "backup FAILED"
          find /backups -name 'verisprint-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
