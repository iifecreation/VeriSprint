[project]
name = "verisprint-api"
version = "0.1.0"
description = "VeriSprint ingestion + API layer: GitHub activity analysis, Confidence Scores, Repo Chat, Slack digests."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "arq>=0.26",
    "redis>=5.1",
    "httpx>=0.27",
    "PyGithub>=2.4",
    "PyJWT[crypto]>=2.9",
    "bcrypt>=4.1",
    "sentry-sdk[fastapi]>=2.18",
    "stripe>=11.1",
    "anthropic>=0.39",
    "slack-bolt>=1.21",
    "aiohttp>=3.10",
    "python-dotenv>=1.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole test session — both fixtures AND test bodies
# (pytest-asyncio scopes these separately; both need to match). The DB
# sessions here bind to app.db.session's module-level pooled engine, whose
# connections bind to whichever loop first used them — a per-test loop
# (pytest-asyncio's default for test bodies) breaks every test after the
# first with "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
