services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: verisprint
      POSTGRES_PASSWORD: verisprint
      POSTGRES_DB: verisprint
    ports:
      # Host port 55432, not 5432 — avoids clashing with other local Postgres
      # instances (e.g. another project's docker-compose on this machine).
      - "55432:5432"
    volumes:
      - verisprint_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verisprint"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host port 56379, not 6379 — same reasoning as postgres above.
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verisprint_postgres_data:
